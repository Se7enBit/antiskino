name: Release

# Publishes main to production, by hand: Actions → Release → Run workflow
# (on main, once CI is green there). In order:
# 1. the database migrations and the edge functions go to the production
#    Supabase project (secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#    SUPABASE_PROJECT_REF; seed.sql is never applied there);
# 2. the commit is tagged "production";
# 3. the website is rebuilt: the production site comes from that tag.
# The dev project keeps getting migrations from the Supabase GitHub integration.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 3.2.0

jobs:
  backend:
    name: Database and edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check what the release needs
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release runs on main only: pick main in 'Use workflow from'."
            exit 1
          fi
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these Actions secrets (GitHub → Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Install Supabase CLI
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C /usr/local/bin supabase
          supabase --version
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # --remote: CLI v3 pushes to the local stack without it. --yes: CLI v3
      # applies changes to a hosted project only with it (no prompt in CI).
      - name: Apply new migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      # Bundled by Supabase (no Docker); verify_jwt settings come from config.toml.
      - name: Deploy edge functions
        run: supabase functions deploy --use-api --yes

  tag:
    name: Tag the released commit
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Move the production tag here
        run: |
          git tag -f production "$GITHUB_SHA"
          git push -f origin refs/tags/production

  website:
    name: Publish website
    needs: tag
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    secrets: inherit
