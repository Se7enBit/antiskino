name: CI

# Runs on every push. Only main deploys the web preview to GitHub Pages.
#
# Database migrations are NOT pushed from here: the Supabase GitHub integration
# ("Deploy to production" on the antiskino-dev project) applies new files in
# supabase/migrations when main is pushed. Keep it that way: one deploy path.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  SUPABASE_CLI_VERSION: 3.2.0
  EXPO_NO_TELEMETRY: 1

jobs:
  app:
    name: Typecheck, lint, Jest, deno test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Jest
        run: npm test -- --ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno tests (edge function shared code)
        run: deno test supabase/functions

  database:
    name: Supabase migrations, pgTAP, types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Supabase CLI
        # A plain download with a time limit and retries: supabase/setup-cli
        # hung for over 10 minutes on two runs.
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C /usr/local/bin supabase
          supabase --version
      - name: Start local Supabase (applies migrations and seed.sql)
        # Postgres, Auth and Storage (they own the auth and storage schemas),
        # the API gateway and postgres-meta are needed for tests and types.
        run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP tests
        run: supabase test db
      - name: Concurrency test (20 attempts at the last pitch)
        # Separate connections, so not pgTAP; uses psql from the runner image.
        run: bash supabase/concurrency/last_pitch.sh
      - name: Generated types are up to date
        run: |
          npm run db:types
          if ! git diff --exit-code -- src/api/database.types.ts; then
            echo "::error::src/api/database.types.ts is stale. Run 'npm run db:types' against the local stack and commit it."
            exit 1
          fi

  web:
    name: Web export
    needs: [app, database]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Export static web build
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_KEY" ]; then
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_KEY are not set (Actions variables or secrets): this build has no sign-in."
          fi
          npx expo export -p web
        env:
          # Public values (the publishable key ends up in the bundle anyway).
          # Read from Actions variables, or from secrets with the same names.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - name: Add GitHub Pages 404 page
        run: cp "dist/+not-found.html" dist/404.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy web preview
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
