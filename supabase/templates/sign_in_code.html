<!doctype html>
<html lang="el">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f7f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1b2420;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
      "
    >
      <p style="margin: 0 0 8px; font-size: 16px">Ο κωδικός σύνδεσης στο Antiskino:</p>
      <p style="margin: 0 0 16px; font-size: 16px">Your Antiskino sign-in code:</p>
      <p style="margin: 0 0 24px; font-size: 32px; font-weight: bold; letter-spacing: 6px">
        {{ .Token }}
      </p>
      <p style="margin: 0 0 8px; font-size: 14px; color: #5c6b64">
        Γράψε τον στην εφαρμογή. Λήγει σε 1 ώρα. Αν δεν τον ζήτησες, αγνόησε αυτό το email.
      </p>
      <p style="margin: 0; font-size: 14px; color: #5c6b64">
        Enter it in the app. It expires in 1 hour. If you didn't ask for it, ignore this email.
      </p>
    </div>
  </body>
</html>
